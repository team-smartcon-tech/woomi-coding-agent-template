name: pr-checks

# PR 필수 검사. 2026-09-13(2.18-draft) 이전까지 이 저장소의 PR 필수 검사는 0개였고, 유일한
# 워크플로 tag-version.yml 은 main push 시 태그만 붙였다. 즉 포맷·린트 설정을 넣어도 강제할
# 자리가 없었다 — 설정만 있고 게이트가 없으면 규칙이 아니라 권고다.
#
# 여기서 막는 것은 회귀뿐이다: 포맷이 어긋나는 것, 타입·린트·테스트·빌드가 깨지는 것.
# 업무 정합성은 검사하지 않는다(그건 테스트가 한다). 형식 검사를 정합성 검증으로 보고하지 않는다.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# 같은 PR 에 연속 푸시하면 앞의 실행을 취소한다. main push 는 취소하지 않는다.
concurrency:
  group: pr-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # 버전을 적지 않으면 package.json 의 packageManager 필드를 따른다 — 핀이 한 곳에만 있게 한다
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # --frozen-lockfile: lockfile 과 package.json 이 어긋나면 여기서 실패한다.
      # 로컬에서 install 을 빠뜨린 PR 이 CI 에서 조용히 다른 버전으로 통과하는 것을 막는다.
      - run: pnpm install --frozen-lockfile

      - name: 포맷 검사
        run: pnpm format:check

      - name: 타입 검사
        run: pnpm typecheck

      - name: 린트
        run: pnpm lint

      - name: 테스트
        run: pnpm test

      - name: 빌드
        run: pnpm build

      # 훅 판정 로직이 깨지면 안전장치가 조용히 통과한다. 이건 로컬 훅이라 CI 가 유일한 검사다.
      - name: 훅 자체 점검
        run: node scripts/agent-guard.cjs --selftest
