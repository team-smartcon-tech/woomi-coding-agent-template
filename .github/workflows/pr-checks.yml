name: pr-checks

# PR 필수 검사. 2026-09-13(2.18-draft) 이전까지 이 저장소의 PR 필수 검사는 0개였고, 유일한
# 워크플로 tag-version.yml 은 main push 시 태그만 붙였다. 즉 포맷·린트 설정을 넣어도 강제할
# 자리가 없었다 — 설정만 있고 게이트가 없으면 규칙이 아니라 권고다.
#
# 여기서 막는 것은 회귀뿐이다: 포맷이 어긋나는 것, 타입·린트·테스트·빌드가 깨지는 것.
# 업무 정합성은 검사하지 않는다(그건 테스트가 한다). 형식 검사를 정합성 검증으로 보고하지 않는다.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# 같은 PR 에 연속 푸시하면 앞의 실행을 취소한다. main push 는 취소하지 않는다.
concurrency:
  group: pr-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      # 버전을 적지 않으면 package.json 의 packageManager 필드를 따른다 — 핀이 한 곳에만 있게 한다
      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # 로컬 훅(.githooks/pre-commit)과 같은 규칙이다. 훅은 core.hooksPath 가 설정된 PC 에서만 돌고
      # --no-verify 로 건너뛸 수 있어, 서버에서 한 번 더 본다. 의존성 설치 전에 돌려 빨리 실패시킨다.
      - name: 시크릿 스캔
        run: |
          node scripts/secret-scan.mjs --selftest
          node scripts/secret-scan.mjs

      - name: lockfile 은 pnpm 하나
        run: |
          if git ls-files | grep -E '(^|/)(package-lock\.json|yarn\.lock|bun\.lockb?)$'; then
            echo "::error::pnpm 저장소에 다른 패키지 매니저의 lockfile 이 있습니다."
            exit 1
          fi

      # --frozen-lockfile: lockfile 과 package.json 이 어긋나면 여기서 실패한다.
      # 로컬에서 install 을 빠뜨린 PR 이 CI 에서 조용히 다른 버전으로 통과하는 것을 막는다.
      - run: pnpm install --frozen-lockfile

      - name: 포맷 검사
        run: pnpm format:check

      - name: 타입 검사
        run: pnpm typecheck

      # typecheck 가 wrangler types 를 돌려 worker-configuration.d.ts 를 덮어쓴다. 그대로 두면 wrangler.jsonc 를
      # 고치고 타입 파일을 커밋하지 않은 PR 도 통과하므로, 덮어쓴 결과가 커밋본과 다르면 실패시킨다.
      - name: Worker 타입 파일 동기화
        run: |
          if ! git diff --exit-code -- apps/web/worker-configuration.d.ts; then
            echo "::error::wrangler.jsonc 와 apps/web/worker-configuration.d.ts 가 어긋납니다. pnpm cf-typegen 을 실행하고 결과를 커밋하세요."
            exit 1
          fi

      - name: 린트
        run: pnpm lint

      - name: 테스트
        run: pnpm test

      - name: 빌드
        run: pnpm build

      # 정적 자산으로 CHANGELOG 같은 내부 문서가 나가지 않는지 본다. 위의 빌드 산출물(build/client)을 검사한다.
      - name: 정적 자산 검사
        run: pnpm assets:check

      # 실제 배포 없이 wrangler 가 설정·번들을 받아들이는지만 확인한다(--dry-run). 계정 정보가 필요 없다.
      - name: 배포 설정 검사
        run: pnpm deploy:dry

      # 코드가 읽는 환경변수 ↔ .env.example·.dev.vars.example ↔ wrangler 설정. secret 을 기본값으로 대체하는 코드도 잡는다.
      - name: 환경변수 경계
        run: |
          node scripts/env-check.mjs --selftest
          node scripts/env-check.mjs

      # 훅 판정 로직이 깨지면 안전장치가 조용히 통과한다. 이건 로컬 훅이라 CI 가 유일한 검사다.
      # selftest 는 훅 정의 파일(.claude/settings.json·.codex/hooks.json)에 가드 호출이 남아 있는지도 본다.
      - name: 훅 자체 점검
        run: node scripts/agent-guard.cjs --selftest

      # 자산 검사 규칙 자체가 깨지면 위의 검사가 조용히 통과한다.
      - name: 정적 자산 검사 자체 점검
        run: node scripts/assets-check.mjs --selftest
